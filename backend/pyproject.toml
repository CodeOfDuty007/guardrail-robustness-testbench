[project]
name = "redteam-testbench"
version = "0.1.0"
description = "OSS guardrail-robustness benchmark built on PyRIT"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlmodel==0.0.22",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
  "cryptography==44.0.0",
  "numpy==2.2.1",
  "scipy==1.15.0",
  "pyyaml==6.0.2",
  "keyring==25.5.0",
  "duckdb>=1.1",
  "pyrit==1.1.0",   # foundational engine (SPEC §3a) — only imported inside app/engine/
]

[project.optional-dependencies]
# PyRIT 1.1.0 verified against the engine in this repo
providers = ["litellm==1.56.4"]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.4", "mypy==1.14.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
ignore = ["E701", "E702", "E401", "E731", "E741", "E712"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check the Git index as well as the ignore rules. A developer's untracked
      # local copies can otherwise hide missing package files until a fresh clone.
      - name: Verify corpus modules are tracked and not ignored
        shell: bash
        run: |
          modules=(
            backend/app/corpus/__init__.py
            backend/app/corpus/service.py
            backend/app/db/corpus/__init__.py
            backend/app/db/corpus/models.py
            backend/app/db/corpus/session.py
          )
          git ls-files --error-unmatch -- "${modules[@]}" > /dev/null
          if git check-ignore --no-index -v -- "${modules[@]}"; then
            echo 'Application corpus modules match a Git ignore rule' >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5

      - name: Install backend and test dependencies
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Import application modules from checkout
        working-directory: backend
        run: |
          .venv/bin/python -c 'import app.main, app.corpus.service, app.db.corpus.models, app.db.corpus.session'

      - name: Run backend tests with simulated target
        working-directory: backend
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
